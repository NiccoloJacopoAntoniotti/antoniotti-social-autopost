# Pubblica automaticamente OGNI GIORNO su Instagram (feed + storia) e Facebook
# per antoniotti-autoricambi, senza intervento manuale.
#
# Secrets da configurare nel repository GitHub (Settings -> Secrets -> Actions):
#   SHOPIFY_STORE_DOMAIN     es. antoniotti-autoricambi.myshopify.com
#   SHOPIFY_ADMIN_TOKEN      Admin API access token (custom app Shopify, scope read_orders + read_products)
#   SHOPIFY_PUBLIC_DOMAIN    es. antoniotti-autoricambi.it (dominio pubblico dello shop, per il link prodotto)
#   META_PAGE_ID             ID della Pagina Facebook
#   META_IG_USER_ID          ID dell'account Instagram Business collegato alla Pagina
#   META_PAGE_ACCESS_TOKEN   Page Access Token di lunga durata (permessi: pages_manage_posts,
#                            pages_read_engagement, instagram_basic, instagram_content_publish, pages_show_list)
#   ANTHROPIC_API_KEY        per generare le caption
#   WHATSAPP_NUMBER          numero in formato internazionale senza + (es. 393331234567)

name: Social autopost

on:
  schedule:
    # Il tentativo "vero" è alle 8 del mattino (ora italiana). Gli altri
    # sono ripescaggi di sicurezza, sparsi su tutta la giornata (mattina,
    # pranzo, pomeriggio, sera) e non ammassati in una manciata di minuti:
    # il cron di GitHub su repository poco attivi può partire con ore di
    # ritardo o saltare del tutto una finestra — è già successo più volte,
    # anche con tre ripescaggi nella stessa mattina. Più i ripescaggi sono
    # distribuiti nell'arco del giorno, più è difficile che spariscano tutti
    # insieme. src/index.js salta da solo i run di troppo se si è già
    # pubblicato oggi, quindi questi sono ripescaggi sicuri, non doppioni.
    #
    # GitHub Actions gira sempre in UTC, quindi ci sono due blocchi identici
    # spostati di un'ora per compensare da soli il cambio ora legale/solare
    # italiana, senza doverli aggiornare due volte l'anno.
    #
    # I minuti NON sono mai ":00": è il momento di picco globale su GitHub
    # Actions (tutti i cron del mondo scattano "in punto"), quindi è anche il
    # momento con più probabilità che una schedulazione venga persa o
    # ritardata parecchio. Stare fuori dall'ora esatta riduce il rischio.
    - cron: '7 6 * 3-10 *'    # ora legale (mar-ott): ~08:07 ora italiana
    - cron: '23 8 * 3-10 *'   # ripescaggio ~10:23 (ora legale)
    - cron: '41 10 * 3-10 *'  # ripescaggio ~12:41 (ora legale)
    - cron: '53 12 * 3-10 *'  # ripescaggio ~14:53 (ora legale)
    - cron: '17 15 * 3-10 *'  # ripescaggio ~17:17 (ora legale)
    - cron: '38 18 * 3-10 *'  # ultimo ripescaggio ~20:38 (ora legale)
    - cron: '7 7 * 11,12,1,2 *'    # ora solare (nov-feb): ~08:07 ora italiana
    - cron: '23 9 * 11,12,1,2 *'   # ripescaggio ~10:23 (ora solare)
    - cron: '41 11 * 11,12,1,2 *'  # ripescaggio ~12:41 (ora solare)
    - cron: '53 13 * 11,12,1,2 *'  # ripescaggio ~14:53 (ora solare)
    - cron: '17 16 * 11,12,1,2 *'  # ripescaggio ~17:17 (ora solare)
    - cron: '38 19 * 11,12,1,2 *'  # ultimo ripescaggio ~20:38 (ora solare)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Configura git
        run: |
          git config user.name "social-autopost-bot"
          git config user.email "actions@github.com"

      - name: Pubblica contenuto
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_PUBLIC_DOMAIN: ${{ secrets.SHOPIFY_PUBLIC_DOMAIN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
        run: npm run post

      - name: Salva storico pubblicazioni
        run: |
          git add data/posted-history.json
          git diff --cached --quiet || git commit -m "chore: aggiorna storico social autopost"
          git push
