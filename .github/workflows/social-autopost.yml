# Pubblica automaticamente ogni 2 giorni (giorni dispari del mese, es. 1, 3,
# 5, 7...) su Instagram (feed + storia) e Facebook per antoniotti-autoricambi,
# senza intervento manuale.
#
# Secrets da configurare nel repository GitHub (Settings -> Secrets -> Actions):
#   SHOPIFY_STORE_DOMAIN     es. antoniotti-autoricambi.myshopify.com
#   SHOPIFY_ADMIN_TOKEN      Admin API access token (custom app Shopify, scope read_orders + read_products)
#   SHOPIFY_PUBLIC_DOMAIN    es. antoniotti-autoricambi.it (dominio pubblico dello shop, per il link prodotto)
#   META_PAGE_ID             ID della Pagina Facebook
#   META_IG_USER_ID          ID dell'account Instagram Business collegato alla Pagina
#   META_PAGE_ACCESS_TOKEN   Page Access Token di lunga durata (permessi: pages_manage_posts,
#                            pages_read_engagement, instagram_basic, instagram_content_publish, pages_show_list)
#   ANTHROPIC_API_KEY        per generare le caption
#   WHATSAPP_NUMBER          numero in formato internazionale senza + (es. 393331234567)

name: Social autopost

on:
  schedule:
    # Il tentativo "vero" è alle 8 del mattino (ora italiana). Gli altri tre
    # sono ripescaggi di sicurezza, sparsi nell'arco della giornata (non
    # ammassati in una manciata di minuti): il cron di GitHub su repository
    # poco attivi può a volte perdere una finestra intera, quindi più i
    # ripescaggi sono vicini tra loro più rischiano di sparire tutti insieme
    # (è già successo). src/index.js salta da solo i run di troppo se si è
    # già pubblicato oggi, quindi questi sono ripescaggi sicuri, non doppioni.
    #
    # GitHub Actions gira sempre in UTC, quindi ci sono due blocchi identici
    # spostati di un'ora per compensare da soli il cambio ora legale/solare
    # italiana, senza doverli aggiornare due volte l'anno. "*/2" sul giorno
    # del mese vuol dire "ogni 2 giorni" (1, 3, 5, 7...).
    - cron: '0 6 */2 3-10 *'        # ora legale (mar-ott): 08:00 ora italiana
    - cron: '0 7 */2 3-10 *'        # ripescaggio ~09:00 (ora legale)
    - cron: '0 9 */2 3-10 *'        # ripescaggio ~11:00 (ora legale)
    - cron: '0 12 */2 3-10 *'       # ultimo ripescaggio ~14:00 (ora legale)
    - cron: '0 7 */2 11,12,1,2 *'   # ora solare (nov-feb): 08:00 ora italiana
    - cron: '0 8 */2 11,12,1,2 *'   # ripescaggio ~09:00 (ora solare)
    - cron: '0 10 */2 11,12,1,2 *'  # ripescaggio ~11:00 (ora solare)
    - cron: '0 13 */2 11,12,1,2 *'  # ultimo ripescaggio ~14:00 (ora solare)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: social-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Configura git
        run: |
          git config user.name "social-autopost-bot"
          git config user.email "actions@github.com"

      - name: Pubblica contenuto
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          SHOPIFY_PUBLIC_DOMAIN: ${{ secrets.SHOPIFY_PUBLIC_DOMAIN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
        run: npm run post

      - name: Salva storico pubblicazioni
        run: |
          git add data/posted-history.json
          git diff --cached --quiet || git commit -m "chore: aggiorna storico social autopost"
          git push
